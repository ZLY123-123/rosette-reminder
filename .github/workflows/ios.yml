name: Build ROSETTE iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Xcode
        run: |
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Compile and package the app
        run: bash ios/scripts/build-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: ROSETTE-iOS
          path: ios/output/ROSETTE-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
