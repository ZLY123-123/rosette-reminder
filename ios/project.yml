name: ReminderDesk
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
packages:
  ReminderCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.4"
    CURRENT_PROJECT_VERSION: "10"
targets:
  ReminderDesk:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: ReminderCore
        product: ReminderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminderdesk.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: AppInfo.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ROSETTE"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: false
