<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">WeChat conversation example</title>
  <desc id="desc">The user schedules a 9 AM check-in, receives a reminder, then quotes it to mark the task complete.</desc>
  <defs>
    <g id="rosette-mark">
      <rect width="32" height="32" rx="10" fill="#dce7e0"/>
      <path d="M16 7.5c1.3 5.6 2.9 7.2 8.5 8.5-5.6 1.3-7.2 2.9-8.5 8.5-1.3-5.6-2.9-7.2-8.5-8.5 5.6-1.3 7.2-2.9 8.5-8.5Z" fill="#426753"/>
    </g>
  </defs>

  <g font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#22292a">
    <rect x="1" y="1" width="958" height="636" rx="19" fill="#f5f6f6" stroke="#d5dada" stroke-width="2"/>
    <path d="M1 70h958M1 581h958" stroke="#dde2e1"/>
    <use href="#rosette-mark" transform="translate(28 16) scale(1.16)"/>
    <text x="78" y="33" font-size="21" font-weight="700">ROSETTE</text>
    <text x="78" y="54" fill="#5e6a67" font-size="15">WeChat direct message</text>
    <rect x="736" y="19" width="192" height="32" rx="16" fill="#fff" stroke="#d8dfdb"/>
    <text x="832" y="40" text-anchor="middle" fill="#43554a" font-size="15">Example conversation</text>

    <g fill="#626d6b" text-anchor="middle" font-size="17">
      <text x="480" y="106">Today, 08:40</text>
      <text x="480" y="316">Today, 09:00</text>
    </g>

    <g id="request">
      <rect x="572" y="125" width="354" height="50" rx="10" fill="#a8e9b2"/>
      <path d="m925 143 9 7-9 7Z" fill="#a8e9b2"/>
      <text x="908" y="157" text-anchor="end" font-size="23">Remind me to check in at 9 AM</text>
    </g>

    <use href="#rosette-mark" x="28" y="195"/>
    <g id="confirmation">
      <rect x="73" y="195" width="294" height="82" rx="10" fill="#e7e9e9"/>
      <path d="m74 209-9 7 9 7Z" fill="#e7e9e9"/>
      <text x="91" y="227" font-size="23">Check-in reminder saved</text>
      <text x="91" y="256" fill="#4e5a58" font-size="19">Today, 09:00 · Beijing time</text>
    </g>

    <use href="#rosette-mark" x="28" y="335"/>
    <g id="reminder">
      <rect x="73" y="335" width="210" height="74" rx="10" fill="#e7e9e9"/>
      <path d="m74 349-9 7 9 7Z" fill="#e7e9e9"/>
      <text x="91" y="364" fill="#4e5a58" font-size="19">Scheduled reminder</text>
      <text x="91" y="391" font-size="23">Check in</text>
    </g>

    <g id="done">
      <rect x="834" y="425" width="92" height="47" rx="10" fill="#a8e9b2"/>
      <path d="m925 441 9 7-9 7Z" fill="#a8e9b2"/>
      <text x="907" y="455" text-anchor="end" font-size="23">Done</text>
    </g>
    <g id="quote">
      <path d="M926 481v24" stroke="#c3cbca" stroke-width="2" stroke-linecap="round"/>
      <text x="912" y="499" text-anchor="end" fill="#626d6b" font-size="17">ROSETTE · Scheduled reminder: Check in</text>
    </g>

    <use href="#rosette-mark" x="28" y="516"/>
    <g id="completed">
      <rect x="73" y="516" width="314" height="47" rx="10" fill="#e7e9e9"/>
      <path d="m74 532-9 7 9 7Z" fill="#e7e9e9"/>
      <text x="91" y="547" font-size="23">Check-in marked complete</text>
    </g>

    <rect x="28" y="594" width="850" height="31" rx="10" fill="#fff" stroke="#d9dfdd"/>
    <text x="45" y="615" fill="#687370" font-size="15">Write a message</text>
    <circle cx="911" cy="609.5" r="16" fill="#dce7e0"/>
    <path d="M904 610h13m-5-5 5 5-5 5" fill="none" stroke="#426753" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
